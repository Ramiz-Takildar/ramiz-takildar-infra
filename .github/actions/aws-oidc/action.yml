#       - name: Deploy Infrastructure
#         run: |
#           terraform init
#           terraform apply -auto-approve
#
# ============================================================================
# IAM Role Trust Policy Example
# ============================================================================
#
# {
#   "Version": "2012-10-17",
#   "Statement": [
#     {
#       "Effect": "Allow",
#       "Principal": {
#         "Federated": "arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com"
#       },
#       "Action": "sts:AssumeRoleWithWebIdentity",
#       "Condition": {
#         "StringEquals": {
#           "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
#         },
#         "StringLike": {
#           "token.actions.githubusercontent.com:sub": "repo:your-org/your-repo:*"
#         }
#       }
#     }
#   ]
# }
#
# ============================================================================
# Setup Instructions
# ============================================================================
#
# 1. Create OIDC Identity Provider in AWS:
#    - Provider URL: https://token.actions.githubusercontent.com
#    - Audience: sts.amazonaws.com
#
# 2. Create IAM Role:
#    - Add trust policy (see example above)
#    - Attach necessary permissions policies
#
# 3. Add Role ARN to GitHub Secrets:
#    - Secret name: AWS_ROLE_ARN
#    - Value: arn:aws:iam::123456789012:role/GitHubActionsRole
#
# 4. Use in workflow:
#    - Add permissions: id-token: write
#    - Use this composite action
#
# ============================================================================
