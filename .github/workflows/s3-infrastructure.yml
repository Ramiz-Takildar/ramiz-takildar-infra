# ============================================================================
# S3 Bucket Infrastructure Workflow
# ============================================================================
# This workflow provisions and manages S3 buckets using Terraform.
#
# Features:
# - Manual trigger with workflow_dispatch
# - Dynamic input parameters
# - Apply and Destroy operations
# - Multi-environment support
# - OIDC authentication
# - Versioning and encryption options
# - Lifecycle policies
# - Security scanning
#
# Usage:
# 1. Go to Actions tab in GitHub
# 2. Select "S3 Infrastructure"
# 3. Click "Run workflow"
# 4. Fill in the parameters
# 5. Click "Run workflow"
# ============================================================================

name: 'S3 Infrastructure'

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - apply
          - destroy
          - plan
        default: 'plan'
      
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      
      bucket_name:
        description: 'S3 bucket name (must be globally unique)'
        required: true
        type: string
      
      enable_versioning:
        description: 'Enable versioning'
        required: true
        type: boolean
        default: true
      
      enable_encryption:
        description: 'Enable encryption'
        required: true
        type: boolean
        default: true
      
      encryption_type:
        description: 'Encryption type'
        required: true
        type: choice
        options:
          - AES256
          - KMS
        default: 'AES256'
      
      block_public_access:
        description: 'Block all public access'
        required: true
        type: boolean
        default: true
      
      enable_logging:
        description: 'Enable access logging'
        required: true
        type: boolean
        default: false
      
      enable_lifecycle:
        description: 'Enable lifecycle policies'
        required: true
        type: boolean
        default: false
      
      lifecycle_transition_days:
        description: 'Days before transitioning to IA storage'
        required: false
        type: number
        default: 30
      
      enable_intelligent_tiering:
        description: 'Enable S3 Intelligent-Tiering'
        required: true
        type: boolean
        default: false
      
      aws_region:
        description: 'AWS Region'
        required: true
        type: choice
        options:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2
          - eu-west-1
          - eu-central-1
          - ap-south-1
          - ap-southeast-1
        default: 'us-east-1'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:
  TERRAFORM_VERSION: '1.6.0'
  WORKING_DIRECTORY: 'terraform/environments/${{ github.event.inputs.environment }}/s3'

jobs:
  validate:
    name: 'Validate Configuration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          working-directory: ${{ env.WORKING_DIRECTORY }}
          validate: true
          format-check: true
      
      - name: Validate Inputs
        run: |
          echo "✅ Validating workflow inputs..."
          echo "Action: ${{ github.event.inputs.action }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Bucket Name: ${{ github.event.inputs.bucket_name }}"
          echo "AWS Region: ${{ github.event.inputs.aws_region }}"
          
          # Validate bucket name format
          if ! echo "${{ github.event.inputs.bucket_name }}" | grep -qE '^[a-z0-9][a-z0-9-]*[a-z0-9]$'; then
            echo "❌ Invalid bucket name format"
            echo "Bucket name must:"
            echo "  - Start and end with lowercase letter or number"
            echo "  - Contain only lowercase letters, numbers, and hyphens"
            echo "  - Be between 3 and 63 characters"
            exit 1
          fi
          
          # Check bucket name length
          BUCKET_LENGTH=${#${{ github.event.inputs.bucket_name }}}
          if [ $BUCKET_LENGTH -lt 3 ] || [ $BUCKET_LENGTH -gt 63 ]; then
            echo "❌ Bucket name must be between 3 and 63 characters"
            exit 1
          fi
          
          echo "✅ All inputs validated successfully"

  security-scan:
    name: 'Security Scan'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.WORKING_DIRECTORY }}
          soft_fail: true
      
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.WORKING_DIRECTORY }}
          framework: terraform
          soft_fail: true

  plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    environment:
      name: ${{ github.event.inputs.environment }}
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.plan-exitcode }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: ./.github/actions/aws-oidc
        with:
          aws-region: ${{ github.event.inputs.aws_region }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      
      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Generate tfvars
        run: |
          cat > ${{ env.WORKING_DIRECTORY }}/terraform.auto.tfvars <<EOF
          # Auto-generated from workflow inputs
          bucket_name = "${{ github.event.inputs.bucket_name }}"
          bucket_name_prefix = "${{ github.event.inputs.environment }}"
          
          # Versioning
          enable_versioning = ${{ github.event.inputs.enable_versioning }}
          
          # Encryption
          kms_master_key_id = "${{ github.event.inputs.encryption_type == 'KMS' && secrets.KMS_KEY_ID || '' }}"
          
          # Public Access Block
          block_public_acls = ${{ github.event.inputs.block_public_access }}
          block_public_policy = ${{ github.event.inputs.block_public_access }}
          ignore_public_acls = ${{ github.event.inputs.block_public_access }}
          restrict_public_buckets = ${{ github.event.inputs.block_public_access }}
          
          # Logging
          enable_logging = ${{ github.event.inputs.enable_logging }}
          logging_target_bucket = "${{ github.event.inputs.enable_logging && secrets.LOGGING_BUCKET || '' }}"
          
          # Lifecycle
          lifecycle_rules = ${{ github.event.inputs.enable_lifecycle }} ? [
            {
              id      = "transition-to-ia"
              enabled = true
              transition = [
                {
                  days          = ${{ github.event.inputs.lifecycle_transition_days }}
                  storage_class = "STANDARD_IA"
                }
              ]
            }
          ] : []
          
          # Intelligent Tiering
          enable_intelligent_tiering = ${{ github.event.inputs.enable_intelligent_tiering }}
          
          # SSL Enforcement
          enforce_ssl = true
          
          # Tags
          tags = {
            Environment = "${{ github.event.inputs.environment }}"
            ManagedBy   = "Terraform"
            Workflow    = "GitHub Actions"
            Repository  = "${{ github.repository }}"
            RunID       = "${{ github.run_id }}"
          }
          EOF
          
          echo "✅ Generated terraform.auto.tfvars"
      
      - name: Terraform Plan
        id: plan
        uses: ./.github/actions/terraform-plan
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          environment: ${{ github.event.inputs.environment }}
          service: s3
          backend-bucket: ramiz-takildar-infra
          backend-region: us-east-1
          upload-plan: true

  apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: plan
    if: github.event.inputs.action == 'apply' && needs.plan.outputs.plan-exitcode == '2'
    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://s3.console.aws.amazon.com/s3/buckets/${{ github.event.inputs.environment }}-${{ github.event.inputs.bucket_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: ./.github/actions/aws-oidc
        with:
          aws-region: ${{ github.event.inputs.aws_region }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      
      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Generate tfvars
        run: |
          cat > ${{ env.WORKING_DIRECTORY }}/terraform.auto.tfvars <<EOF
          bucket_name = "${{ github.event.inputs.bucket_name }}"
          bucket_name_prefix = "${{ github.event.inputs.environment }}"
          enable_versioning = ${{ github.event.inputs.enable_versioning }}
          kms_master_key_id = "${{ github.event.inputs.encryption_type == 'KMS' && secrets.KMS_KEY_ID || '' }}"
          block_public_acls = ${{ github.event.inputs.block_public_access }}
          block_public_policy = ${{ github.event.inputs.block_public_access }}
          ignore_public_acls = ${{ github.event.inputs.block_public_access }}
          restrict_public_buckets = ${{ github.event.inputs.block_public_access }}
          enable_logging = ${{ github.event.inputs.enable_logging }}
          enable_intelligent_tiering = ${{ github.event.inputs.enable_intelligent_tiering }}
          enforce_ssl = true
          
          tags = {
            Environment = "${{ github.event.inputs.environment }}"
            ManagedBy   = "Terraform"
            Workflow    = "GitHub Actions"
            Repository  = "${{ github.repository }}"
            RunID       = "${{ github.run_id }}"
          }
          EOF
      
      - name: Terraform Apply
        uses: ./.github/actions/terraform-apply
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          environment: ${{ github.event.inputs.environment }}
          service: s3
          backend-bucket: ramiz-takildar-infra
          backend-region: us-east-1
          auto-approve: true
      
      - name: Post Deployment Info
        run: |
          echo "## 🪣 S3 Bucket Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Bucket Name:** ${{ github.event.inputs.environment }}-${{ github.event.inputs.bucket_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ github.event.inputs.aws_region }}" >> $GITHUB_STEP_SUMMARY
          echo "**Versioning:** ${{ github.event.inputs.enable_versioning }}" >> $GITHUB_STEP_SUMMARY
          echo "**Encryption:** ${{ github.event.inputs.encryption_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Public Access:** ${{ github.event.inputs.block_public_access && 'Blocked' || 'Allowed' }}" >> $GITHUB_STEP_SUMMARY

  destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.action == 'destroy'
    environment:
      name: ${{ github.event.inputs.environment }}-destroy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: ./.github/actions/aws-oidc
        with:
          aws-region: ${{ github.event.inputs.aws_region }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      
      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Terraform Destroy
        uses: ./.github/actions/terraform-destroy
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          environment: ${{ github.event.inputs.environment }}
          service: s3
          backend-bucket: ramiz-takildar-infra
          backend-region: us-east-1
          auto-approve: true
      
      - name: Post Destroy Info
        run: |
          echo "## 🗑️ S3 Bucket Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Bucket Name:** ${{ github.event.inputs.environment }}-${{ github.event.inputs.bucket_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Bucket and all contents have been destroyed" >> $GITHUB_STEP_SUMMARY
